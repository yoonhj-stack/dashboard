      animation: false,
      plugins: {
        legend: { display: true, position: 'top', labels: { color:'#333', font:{size:11}, boxWidth:14, boxHeight:3 } },
        tooltip: { mode:'index', intersect:false, backgroundColor:'rgba(255,255,255,0.96)', titleColor:'#111', bodyColor:'#333', borderColor:'#ccc', borderWidth:1 },
      },
      interaction: { mode:'index', intersect:false },
      scales: buildScales(),
    }
  });
}

const ctrls = document.getElementById('ctrls');
series.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'ctrl active';
  btn.textContent = s.label;
  btn.style.borderColor = s.color;
  btn.style.background = s.color;
  btn.style.color = 'white';
  btn.onclick = () => {
    visible[s.key] = !visible[s.key];
    if (visible[s.key]) {
      btn.style.background = s.color;
      btn.style.color = 'white';
      btn.classList.add('active');
    } else {
      btn.style.background = '#fff';
      btn.style.color = '#555';
      btn.classList.remove('active');
    }
    render();
  };
  ctrls.appendChild(btn);
});

render();
</script>
</body>
</html>
