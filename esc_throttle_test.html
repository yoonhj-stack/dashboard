const series = [
  { key:'voltage',          label:'Voltage (V)',          color:'#9333ea', axis:'yV', unit:'V',   min:0, max:60 },
  { key:'current',          label:'Current (A)',          color:'#2563eb', axis:'yA', unit:'A',   min:0, max:80 },
  { key:'temp_c',           label:'Temperature (°C)',     color:'#dc2626', axis:'yT', unit:'°C',  min:0, max:95 },
  { key:'power',            label:'Power (W)',            color:'#059669', axis:'yW', unit:'W',   min:0, max:4000 },
  { key:'input_throttle',   label:'Input Throttle (us)',  color:'#db2777', axis:'yI', unit:'us',  min:0, max:1950 },
  { key:'output_throttle',  label:'Output Throttle (%)',  color:'#ea580c', axis:'yO', unit:'%',   min:0, max:100 },
  { key:'rpm',              label:'Motor RPM',            color:'#0891b2', axis:'yR', unit:'RPM', min:0, max:60000 },
  { key:'power_consumption',label:'Energy (Ah)',          color:'#525252', axis:'yE', unit:'Ah',  min:0, max:50 },
];

const visible = {};
series.forEach(s => visible[s.key] = true);

function buildDatasets() {
  return series.filter(s => visible[s.key]).map(s => ({
    label: s.label + ' [' + s.min + '~' + s.max + s.unit + ']',
    data: DATA.time.map((t,i) => ({x:t, y:DATA[s.key][i]})),
    borderColor: s.color,
    backgroundColor: s.color + '15',
    yAxisID: s.axis,
    borderWidth: 1.3,
    pointRadius: 0,
    pointHoverRadius: 3,
    tension: 0.05,
  }));
}

function buildScales() {
  const scales = {
    x: { type:'linear', title:{display:true, text:'Time (s)', color:'#333', font:{size:11, weight:'600'}}, ticks:{color:'#555'}, grid:{color:'rgba(0,0,0,0.06)'} },
  };
  const visSeries = series.filter(s => visible[s.key]);
  visSeries.forEach((s, idx) => {
    const isLeft = idx % 2 === 0;
    scales[s.axis] = {
      type: 'linear',
      position: isLeft ? 'left' : 'right',
      min: s.min,
      max: s.max,
      title: { display:true, text: s.label, color: s.color, font: {size:10, weight:'600'} },
      ticks: { color: s.color, font:{size:9} },
      grid: { drawOnChartArea: idx === 0, color: 'rgba(0,0,0,0.04)' },
    };
  });
  return scales;
}

let chart;
function render() {
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { datasets: buildDatasets() },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      plugins: {
        legend: { display: true, position: 'top', labels: { color:'#333', font:{size:11}, boxWidth:14, boxHeight:3 } },
        tooltip: { mode:'index', intersect:false, backgroundColor:'rgba(255,255,255,0.96)', titleColor:'#111', bodyColor:'#333', borderColor:'#ccc', borderWidth:1 },
      },
      interaction: { mode:'index', intersect:false },
      scales: buildScales(),
    }
  });
}

const ctrls = document.getElementById('ctrls');
series.forEach(s => {
  const btn = document.createElement('button');
  btn.className = 'ctrl active';
  btn.textContent = s.label;
  btn.style.borderColor = s.color;
  btn.style.background = s.color;
  btn.style.color = 'white';
  btn.onclick = () => {
    visible[s.key] = !visible[s.key];
    if (visible[s.key]) {
      btn.style.background = s.color;
      btn.style.color = 'white';
      btn.classList.add('active');
    } else {
      btn.style.background = '#fff';
      btn.style.color = '#555';
      btn.classList.remove('active');
    }
    render();
  };
  ctrls.appendChild(btn);
});

render();
</script>
